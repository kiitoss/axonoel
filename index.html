<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AxoNoël · Les jeux de Noël</title>
  <meta name="description" content="Les petits jeux de Noël de l'équipe Axopen.">
  <meta name="theme-color" content="#2A1458">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop-x" src="./assets/x.svg" alt="">
    <svg class="spark s1" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="spark s2" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="spark s3" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="spark s4" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="spark s5" viewBox="0 0 24 24"><use href="#spark"/></svg>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="spark" viewBox="0 0 24 24">
      <path d="M12 0 C12.6 7 17 11.4 24 12 C17 12.6 12.6 17 12 24 C11.4 17 7 12.6 0 12 C7 11.4 11.4 7 12 0Z" fill="currentColor"/>
    </symbol>
  </svg>

  <ul class="garland" aria-hidden="true"></ul>

  <header class="hero">
    <img class="logo" src="./assets/logo-blanc.svg" alt="Axopen" width="220" height="41">
    <h1>Les jeux de <span class="noel">Noël</span></h1>
  </header>

  <main>
    <div id="games" class="grid" aria-live="polite"></div>
    <noscript><p class="empty">Active JavaScript pour voir la liste des jeux.</p></noscript>
  </main>

  <footer class="footer">
    <button id="install" class="install" hidden>Installer l'app</button>
    <p>Joyeux Noël 🎄 — Le C.O.N de Noël</p>
    <p class="version">Version <span id="version">dev</span></p>
  </footer>

  <template id="card-tpl">
    <a class="card">
      <div class="thumb"><img loading="lazy" decoding="async" alt=""><span class="tag" hidden></span></div>
      <div class="body">
        <h2></h2>
        <p></p>
        <span class="play">Jouer <span aria-hidden="true">→</span></span>
      </div>
    </a>
  </template>

  <script src="./games.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
